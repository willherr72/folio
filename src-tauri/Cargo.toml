[package]
name = "folio"
version = "0.9.0"
description = "Native backend for the Folio desktop PDF editor"
edition = "2021"

[lib]
name = "folio_engine"
path = "src/lib.rs"

[[bin]]
name = "folio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = { version = "=0.45.0", default-features = false }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
same-file = "1"
tempfile = "3"
tauri = { version = "2", features = [] }
thiserror = "2"
ttf-parser = "=0.25.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Controls_Dialogs", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
