[package]
name = "folio"
version = "0.1.0"
description = "Native backend for the Folio desktop PDF editor"
edition = "2021"

[lib]
name = "folio_engine"
path = "src/lib.rs"

[[bin]]
name = "folio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
tempfile = "3"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
